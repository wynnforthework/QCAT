basePath: /api/v1
definitions:
  api.AddToBlacklistRequest:
    properties:
      expires_at:
        type: string
      permanent:
        type: boolean
      reason:
        type: string
      strategy_id:
        type: string
    required:
    - reason
    - strategy_id
    type: object
  api.AuthResponse:
    properties:
      access_token:
        type: string
      expires_at:
        type: string
      refresh_token:
        type: string
      role:
        type: string
      user_id:
        type: string
      username:
        type: string
    type: object
  api.EmergencyResetRequest:
    properties:
      reason:
        type: string
    required:
    - reason
    type: object
  api.EmergencyStopRequest:
    properties:
      reason:
        type: string
    required:
    - reason
    type: object
  api.EvolutionInfo:
    properties:
      averageFitness:
        type: number
      bestFitness:
        type: number
      currentGeneration:
        type: integer
      diversityIndex:
        type: number
      eliminatedCount:
        type: integer
      populationSize:
        type: integer
    type: object
  api.ExecutionActivity:
    properties:
      action:
        type: string
      latency:
        type: number
      status:
        type: string
      strategyId:
        type: string
      strategyName:
        type: string
      timestamp:
        type: string
    type: object
  api.ExecutionOverviewResponse:
    properties:
      performance:
        $ref: '#/definitions/api.ExecutionPerformanceInfo'
      recentExecutions:
        items:
          $ref: '#/definitions/api.ExecutionActivity'
        type: array
      system:
        $ref: '#/definitions/api.ExecutionSystemInfo'
    type: object
  api.ExecutionPerformanceInfo:
    properties:
      errorRate:
        type: number
      latency:
        type: number
      successRate:
        type: number
      throughput:
        type: integer
      totalExecutions:
        type: integer
    type: object
  api.ExecutionSystemInfo:
    properties:
      activeStrategies:
        type: integer
      status:
        type: string
      totalStrategies:
        type: integer
      uptime:
        type: string
    type: object
  api.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  api.PoolActivity:
    properties:
      message:
        type: string
      strategyId:
        type: string
      timestamp:
        type: string
      type:
        type: string
    type: object
  api.PoolOverviewResponse:
    properties:
      distribution:
        additionalProperties: true
        type: object
      recentActivity:
        items:
          $ref: '#/definitions/api.PoolActivity'
        type: array
      resourceUsage:
        $ref: '#/definitions/api.ResourceUsageInfo'
      summary:
        $ref: '#/definitions/strategy.StrategySummary'
    type: object
  api.RealtimeStatusResponse:
    properties:
      activeStrategies:
        items:
          $ref: '#/definitions/api.RealtimeStrategyInfo'
        type: array
      alerts:
        items:
          $ref: '#/definitions/api.SystemAlert'
        type: array
      systemMetrics:
        $ref: '#/definitions/api.SystemMetrics'
      timestamp:
        type: string
    type: object
  api.RealtimeStrategyInfo:
    properties:
      id:
        type: string
      lastExecution:
        type: string
      latency:
        type: number
      name:
        type: string
      pnl:
        type: number
      status:
        type: string
      successRate:
        type: number
    type: object
  api.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  api.RegisterRequest:
    properties:
      email:
        type: string
      password:
        type: string
      username:
        type: string
    required:
    - email
    - password
    - username
    type: object
  api.ResourceMetric:
    properties:
      total:
        type: number
      usage:
        type: number
      used:
        type: number
    type: object
  api.ResourceUsageInfo:
    properties:
      activeWorkers:
        type: integer
      cpu:
        $ref: '#/definitions/api.ResourceMetric'
      memory:
        $ref: '#/definitions/api.ResourceMetric'
      queuedTasks:
        type: integer
    type: object
  api.Response:
    properties:
      data: {}
      error:
        type: string
      message:
        type: string
      success:
        type: boolean
    type: object
  api.Settings:
    properties:
      system:
        $ref: '#/definitions/api.SystemSettings'
      trading:
        $ref: '#/definitions/api.TradingSettings'
    type: object
  api.SystemAlert:
    properties:
      level:
        type: string
      message:
        type: string
      time:
        type: string
    type: object
  api.SystemMetrics:
    properties:
      cpu_usage:
        type: number
      disk_usage:
        type: number
      goroutines:
        type: integer
      memory_usage:
        type: number
      timestamp:
        type: string
      uptime:
        type: number
    type: object
  api.SystemSettings:
    properties:
      cacheSize:
        type: string
      debugMode:
        type: boolean
      logLevel:
        type: string
    type: object
  api.TradingSettings:
    properties:
      defaultStopLoss:
        type: integer
      dryRunMode:
        type: boolean
      maxPositionRatio:
        type: integer
      riskControl:
        type: boolean
    type: object
  api.WorkflowActivity:
    properties:
      estimatedEnd:
        type: string
      id:
        type: string
      name:
        type: string
      progress:
        type: integer
      stage:
        type: string
      startTime:
        type: string
      status:
        type: string
    type: object
  api.WorkflowResourceInfo:
    properties:
      activeWorkers:
        type: integer
      globalCpuUsage:
        type: number
      globalMemoryUsage:
        type: number
      queuedTasks:
        type: integer
    type: object
  api.WorkflowStatusResponse:
    properties:
      evolution:
        $ref: '#/definitions/api.EvolutionInfo'
      recentWorkflows:
        items:
          $ref: '#/definitions/api.WorkflowActivity'
        type: array
      resources:
        $ref: '#/definitions/api.WorkflowResourceInfo'
      system:
        $ref: '#/definitions/api.WorkflowSystemInfo'
    type: object
  api.WorkflowSystemInfo:
    properties:
      activeWorkflows:
        type: integer
      concurrentStrategies:
        type: integer
      evolutionGeneration:
        type: integer
      status:
        type: string
      uptime:
        type: string
    type: object
  database.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      last_login:
        type: string
      role:
        type: string
      status:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  orchestrator.OptimizationConfig:
    properties:
      method:
        type: string
      parameters:
        additionalProperties: true
        type: object
    type: object
  orchestrator.OptimizationRequest:
    properties:
      grid_size:
        type: integer
      max_iterations:
        type: integer
      method:
        type: string
      optimization:
        $ref: '#/definitions/orchestrator.OptimizationConfig'
      parameters:
        additionalProperties: true
        type: object
      request_id:
        type: string
      strategy_id:
        type: string
      time_range:
        $ref: '#/definitions/orchestrator.TimeRange'
    type: object
  orchestrator.TimeRange:
    properties:
      end:
        type: string
      start:
        type: string
    type: object
  strategy.ExecutionInfo:
    properties:
      avgLatency:
        type: number
      errorCount:
        type: integer
      executionCount:
        type: integer
      isRunning:
        type: boolean
      lastError:
        type: string
      lastExecution:
        type: string
      nextExecution:
        type: string
      successCount:
        type: integer
      successRate:
        type: number
    type: object
  strategy.LifecycleInfo:
    properties:
      canDelete:
        type: boolean
      canEdit:
        type: boolean
      canStart:
        type: boolean
      canStop:
        type: boolean
      isEnabled:
        type: boolean
      stage:
        description: draft, testing, production, deprecated
        type: string
      status:
        description: active, inactive, paused, error
        type: string
    type: object
  strategy.PerformanceInfo:
    properties:
      avgTrade:
        type: number
      bestTrade:
        type: number
      maxDrawdown:
        type: number
      pnl:
        type: number
      profitFactor:
        type: number
      sharpeRatio:
        type: number
      totalReturn:
        type: number
      tradeCount:
        type: integer
      volatility:
        type: number
      winRate:
        type: number
      worstTrade:
        type: number
    type: object
  strategy.PoolInfo:
    properties:
      lastSync:
        type: string
      poolMetrics:
        $ref: '#/definitions/strategy.PoolMetrics'
      poolStatus:
        description: enabled, disabled, testing, pending
        type: string
      priority:
        description: high, medium, low
        type: string
      resourceAllocation:
        $ref: '#/definitions/strategy.ResourceAllocation'
      syncStatus:
        type: string
    type: object
  strategy.PoolMetrics:
    properties:
      conflictCount:
        type: integer
      executionWeight:
        type: number
      queuePosition:
        type: integer
      resourceUsage:
        type: number
    type: object
  strategy.ResourceAllocation:
    properties:
      cpu:
        type: number
      gpu:
        type: number
      memory:
        type: number
    type: object
  strategy.StrategyListResponse:
    properties:
      page:
        type: integer
      pageSize:
        type: integer
      strategies:
        items:
          $ref: '#/definitions/strategy.UnifiedStrategy'
        type: array
      summary:
        $ref: '#/definitions/strategy.StrategySummary'
      total:
        type: integer
    type: object
  strategy.StrategySummary:
    properties:
      performance:
        properties:
          avgReturn:
            type: number
          avgSharpe:
            type: number
          totalPnl:
            type: number
          winningCount:
            type: integer
        type: object
      pool:
        properties:
          disabled:
            type: integer
          enabled:
            type: integer
          pending:
            type: integer
          testing:
            type: integer
        type: object
      total:
        properties:
          active:
            type: integer
          count:
            type: integer
          inactive:
            type: integer
          production:
            type: integer
          testing:
            type: integer
        type: object
    type: object
  strategy.UnifiedStrategy:
    properties:
      config:
        additionalProperties: true
        description: 配置信息
        type: object
      createdAt:
        type: string
      description:
        type: string
      execution:
        allOf:
        - $ref: '#/definitions/strategy.ExecutionInfo'
        description: 执行信息
      id:
        description: 基本信息
        type: string
      lifecycle:
        allOf:
        - $ref: '#/definitions/strategy.LifecycleInfo'
        description: 生命周期信息
      name:
        type: string
      performance:
        allOf:
        - $ref: '#/definitions/strategy.PerformanceInfo'
        description: 性能信息
      pool:
        allOf:
        - $ref: '#/definitions/strategy.PoolInfo'
        description: 策略池信息
      type:
        type: string
      updatedAt:
        type: string
      version:
        type: string
    type: object
host: localhost:8082
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: Quantitative Contract Automated Trading System API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: QCAT API
  version: "1.0"
paths:
  /api/v1/strategy:
    get:
      consumes:
      - application/json
      description: 获取策略列表，支持多种视图和过滤选项
      parameters:
      - default: list
        description: 视图类型
        enum:
        - list
        - pool
        - execution
        - performance
        - management
        in: query
        name: view
        type: string
      - collectionFormat: csv
        description: 状态过滤
        in: query
        items:
          type: string
        name: status
        type: array
      - collectionFormat: csv
        description: 类型过滤
        in: query
        items:
          type: string
        name: type
        type: array
      - collectionFormat: csv
        description: 阶段过滤
        in: query
        items:
          type: string
        name: stage
        type: array
      - collectionFormat: csv
        description: 池状态过滤
        in: query
        items:
          type: string
        name: pool_status
        type: array
      - default: updated_at
        description: 排序字段
        in: query
        name: sort_by
        type: string
      - default: desc
        description: 排序方向
        enum:
        - asc
        - desc
        in: query
        name: sort_order
        type: string
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 页大小
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/strategy.StrategyListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      summary: 获取策略列表
      tags:
      - strategy
  /api/v1/strategy/{id}:
    get:
      consumes:
      - application/json
      description: 获取单个策略的完整信息，包括执行状态、性能数据、池信息等
      parameters:
      - description: 策略ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/strategy.UnifiedStrategy'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      summary: 获取策略详情
      tags:
      - strategy
  /api/v1/strategy/execution/overview:
    get:
      consumes:
      - application/json
      description: 获取策略执行系统的整体状态和性能指标
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ExecutionOverviewResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      summary: 获取执行系统概览
      tags:
      - strategy
  /api/v1/strategy/execution/realtime:
    get:
      consumes:
      - application/json
      description: 获取策略执行的实时状态信息
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.RealtimeStatusResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      summary: 获取实时状态
      tags:
      - strategy
  /api/v1/strategy/pool/overview:
    get:
      consumes:
      - application/json
      description: 获取策略池的整体状态和统计信息
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.PoolOverviewResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      summary: 获取策略池概览
      tags:
      - strategy
  /api/v1/strategy/workflow/status:
    get:
      consumes:
      - application/json
      description: 获取多策略工作流系统的状态信息
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.WorkflowStatusResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      summary: 获取工作流状态
      tags:
      - strategy
  /audit/decisions:
    get:
      consumes:
      - application/json
      description: Get trading decision chains and audit trails for analysis
      parameters:
      - description: Start date (YYYY-MM-DD)
        in: query
        name: start_date
        type: string
      - description: End date (YYYY-MM-DD)
        in: query
        name: end_date
        type: string
      - description: Filter by strategy ID
        in: query
        name: strategy_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  items:
                    type: object
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      summary: Get decision chains
      tags:
      - Audit
  /audit/export:
    post:
      consumes:
      - application/json
      description: Export audit data as a report in various formats (PDF, CSV, JSON)
      parameters:
      - description: Export parameters
        in: body
        name: request
        required: true
        schema:
          properties:
            end_date:
              type: string
            start_date:
              type: string
            type:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  properties:
                    download_url:
                      type: string
                    report_id:
                      type: string
                  type: object
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      summary: Export audit report
      tags:
      - Audit
  /audit/logs:
    get:
      consumes:
      - application/json
      description: Get audit logs with optional filtering by date range and user
      parameters:
      - description: Start date (YYYY-MM-DD)
        in: query
        name: start_date
        type: string
      - description: End date (YYYY-MM-DD)
        in: query
        name: end_date
        type: string
      - description: Filter by user ID
        in: query
        name: user_id
        type: string
      - description: Filter by action type
        in: query
        name: action
        type: string
      - default: 100
        description: Limit number of results
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  items:
                    type: object
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      summary: Get audit logs
      tags:
      - Audit
  /audit/performance:
    get:
      consumes:
      - application/json
      description: Get performance metrics from audit data for system analysis
      parameters:
      - default: 30d
        description: Analysis period (7d, 30d, 90d)
        in: query
        name: period
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  items:
                    type: object
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      summary: Get audit performance metrics
      tags:
      - Audit
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return JWT tokens
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/api.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Response'
      summary: User login
      tags:
      - Auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Logout user and invalidate refresh token
      parameters:
      - description: Refresh token to invalidate
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Response'
      summary: User logout
      tags:
      - Auth
  /auth/profile:
    get:
      consumes:
      - application/json
      description: Get current user information
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/database.User'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - BearerAuth: []
      summary: Get current user profile
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Refresh access token using refresh token
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/api.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Response'
      summary: Refresh token
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user
      parameters:
      - description: Registration data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/api.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.Response'
      summary: User registration
      tags:
      - Auth
  /auto-start/stats:
    get:
